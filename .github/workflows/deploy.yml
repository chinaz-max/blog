 name: Deploy to GitHub Pages
 
 on:
   push:
     branches: [main]
   workflow_dispatch:
   schedule:
     - cron: '7,37 * * * *'
 
 permissions:
   contents: read
   pages: write
   id-token: write
 
 concurrency:
   group: pages
   cancel-in-progress: false
 
 jobs:
   build:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-node@v4
         with:
           node-version: 20
       - uses: pnpm/action-setup@v4
       - name: Install dependencies
         run: pnpm install
       - name: Verify free game feed
         run: node --test scripts/free-games.test.mjs
       - name: Build
         run: pnpm build
       - name: Upload artifact
         uses: actions/upload-pages-artifact@v3
         with:
           path: dist
 
   deploy:
     environment:
       name: github-pages
       url: https://ctfer.cn
     runs-on: ubuntu-latest
     needs: build
     steps:
       - name: Deploy to GitHub Pages
         id: deployment
         uses: actions/deploy-pages@v4
